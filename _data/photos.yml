# Gallery for the "Beyond" page.
#
# To add a photo: drop the file in assets/img/photos/ and append an entry here.
# Nothing else needs to change - the layout places it automatically, whatever its
# aspect ratio. Entries render in the order listed (newest first reads best).
#
#   file:  required. Filename inside assets/img/photos/
#   date:  optional. Free text, e.g. "June 2026"
#   place: optional. Free text, e.g. "Fethiye, Türkiye"
#   emoji: optional. One or two characters
#   alt:   optional but recommended. Describes the image for screen readers;
#          falls back to the caption text when omitted.
#
# The caption is assembled from whichever of date/place/emoji are present, so a
# photo with only a place still looks right, and a photo with none renders with
# no caption at all.

